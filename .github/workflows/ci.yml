name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build
        run: go build ./cmd/agentd
      - name: Test
        run: go test -count=1 ./...
      - name: Race
        run: go test -race -count=1 ./...
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Command center helpers
        run: node --test 'internal/api/uitest/*.test.mjs'
